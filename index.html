<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Minjong Kim</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="grid">

    <!-- COLUMN 1 -->
    <section class="column">
      <p>Minjong Kim</p>
      <p>Type &amp; Graphic Design</p>
      <p>Zürich, Seoul</p>
    </section>


    <!-- COLUMN 2 -->
    <section class="column">
      <p>
        E-mail<br>
        <a href="mailto:minjongkim.production@gmail.com">
          minjongkim.production@gmail.com
        </a>
      </p>

      <p>
        Instagram<br>
        <a
          href="https://www.instagram.com/minjongkirn"
          target="_blank"
          rel="noopener noreferrer"
        >
          @minjongkirn
        </a>
      </p>
    </section>


    <!-- COLUMN 3 -->
    <section class="column">
      <p>Office/Post – Lineto GmbH</p>
      <p>Lutherstrasse 32, CH-8004 Zürich</p>
    </section>


    <!-- COLUMN 4 -->
    <section class="column clock">
      <p>
        CET <span id="zurich-time">--:--:--</span> /
        KST <span id="seoul-time">--:--:--</span>
      </p>
    </section>

  </main>


  <script>
    function updateClock() {

      const now = new Date();

      const zurich = new Intl.DateTimeFormat('en-GB', {
        timeZone: 'Europe/Zurich',
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit',
        hour12: false
      }).format(now);

      const seoul = new Intl.DateTimeFormat('en-GB', {
        timeZone: 'Asia/Seoul',
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit',
        hour12: false
      }).format(now);

      document.getElementById('zurich-time').textContent = zurich;
      document.getElementById('seoul-time').textContent = seoul;
    }

    updateClock();
    setInterval(updateClock, 1000);
  </script>

</body>
</html>
