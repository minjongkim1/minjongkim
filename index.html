<!DOCTYPE html>
<html lang="en">

<body>

  <div class="bio">
    <h1>Minjong Kim</h1>
    <p>Type and Graphic Design, Lineto GmbH</p>
    <p>Based in Zürich-CH / Seoul-KR</p>
    <p>
      Contact: 
      <a href="mailto:minjongkim.production@gmail.com">E-mail</a> /
      <a href="https://instagram.com/minjongkirn" target="_blank">Instagram</a>

  <div class="clock">

<button id="darkmode-toggle" class="toggle-button" aria-label="Toggle Dark Mode"></button>

  <script src="script.js"></script>
  <script src="clock.js"></script>
  <script src="darkmode.js"></script>
